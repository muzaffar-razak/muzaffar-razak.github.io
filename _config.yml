title: Adam's Personal Website
description: Made by Adam Muzaffar Abd Razak
baseurl: ""
url: https://muzaffar.works

remote_theme: piazzai/hacked-jekyll

exclude:
  - LICENSE
  - README.md
  - Gemfile
  - vendor/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

sass:
  sourcemap: never

color_bg: gray-0

color_punct: gray-6

color_key: gray-9

color_value: gray-9

color_hover: indigo-8 
